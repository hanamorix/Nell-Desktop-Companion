# Nell's private kitty, run as a hidden panel inside her console bubble.
font_family Departure Mono
# 16.5 pt = 3x Departure Mono's 11 px pixel grid on a 2x display, so it stays crisp
font_size 16.5
confirm_os_window_close 0
# kitten panel forces macos_quit_when_last_window_closed=yes (a later -o loses too), so closing the last tab quits
# kitty; Nell starts a new one on the next send.
scrollback_lines 5000
# Claude starts through your login shell, which execs it at once: kitty mustn't inject its shell integration
# (ZDOTDIR, KITTY_SHELL_INTEGRATION…) into that shell, or Claude's environment would differ from your terminal's.
shell_integration disabled
# Nell owns the tabs and the panel: no shortcut may open, close, switch or quit a tab or window, hide or resize the panel,
# or reach the command palette (it runs any action). Copy, paste and scrolling keep their defaults.
map ctrl+tab discard_event
map ctrl+shift+tab discard_event
map shift+cmd+] discard_event
map shift+cmd+[ discard_event
map kitty_mod+right discard_event
map kitty_mod+left discard_event
map cmd+h discard_event
map cmd+m discard_event
map ctrl+cmd+f discard_event
map kitty_mod+f10 discard_event
map kitty_mod+f11 discard_event
map kitty_mod+f3 discard_event
map cmd+t discard_event
map cmd+n discard_event
map cmd+enter discard_event
map cmd+w discard_event
map shift+cmd+w discard_event
map shift+cmd+d discard_event
map cmd+q discard_event
map cmd+, discard_event
map kitty_mod+t discard_event
map kitty_mod+n discard_event
map kitty_mod+enter discard_event
map kitty_mod+w discard_event
map kitty_mod+q discard_event
map kitty_mod+f2 discard_event
map kitty_mod+escape discard_event
# the Nth-window keys (cmd+1-9, kitty_mod+1-0) and moving tabs: one window per tab, and Nell owns the tab order
map cmd+1 discard_event
map cmd+2 discard_event
map cmd+3 discard_event
map cmd+4 discard_event
map cmd+5 discard_event
map cmd+6 discard_event
map cmd+7 discard_event
map cmd+8 discard_event
map cmd+9 discard_event
map kitty_mod+1 discard_event
map kitty_mod+2 discard_event
map kitty_mod+3 discard_event
map kitty_mod+4 discard_event
map kitty_mod+5 discard_event
map kitty_mod+6 discard_event
map kitty_mod+7 discard_event
map kitty_mod+8 discard_event
map kitty_mod+9 discard_event
map kitty_mod+0 discard_event
map kitty_mod+. discard_event
map kitty_mod+, discard_event
# Nell writes the chosen theme's colours (kittyColorsConf) to kitty-colors.conf beside this file.
include kitty-colors.conf
