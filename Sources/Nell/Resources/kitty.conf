# Nell's private kitty, run as a hidden panel inside her console bubble.
font_family Departure Mono
# 16.5 pt = 3x Departure Mono's 11 px pixel grid on a 2x display, so it stays crisp
font_size 16.5
confirm_os_window_close 0
macos_quit_when_last_window_closed no
scrollback_lines 5000
# Nell writes the chosen theme's colours (kittyColorsConf) to kitty-colors.conf beside this file.
include kitty-colors.conf
