# Nell's private kitty, run as a hidden panel inside her console bubble.
font_family Departure Mono
# 16.5 pt = 3x Departure Mono's 11 px pixel grid on a 2x display, so it stays crisp
font_size 16.5
confirm_os_window_close 0
macos_quit_when_last_window_closed no
scrollback_lines 5000

# Plum Night (concept-nell-design-system/tokens.json). Every text colour stays readable on the plum-900 ground.
background #1a1214
foreground #f5d4c9
cursor #ec9394
selection_background #3f3039
# kitty's default selection text is black, unreadable on plum-700
selection_foreground #f5d4c9
# The palette has no cyan, so blue and cyan share user-blue-hi; dim text (color8) is muted, not plum-500.
color0  #261a22
color1  #cf7d8b
color2  #4f8a46
color3  #a8762f
color4  #6f8fd0
color5  #f4b6ac
color6  #6f8fd0
color7  #f5d4c9
color8  #c4a9ab
color9  #ec9394
color10 #8ccf7a
color11 #e9b45f
color12 #6f8fd0
color13 #f4b6ac
color14 #6f8fd0
color15 #fff4ec
